name: llm-dashboard

services:
  llm-dashboard:
    build: ./app
    image: llm-dashboard:local
    container_name: llm-dashboard
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    ports:
      - "0.0.0.0:18765:8765"
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      RUN_RETENTION_DAYS: ${RUN_RETENTION_DAYS:-90}
      ARTIFACT_RETENTION_DAYS: ${ARTIFACT_RETENTION_DAYS:-30}
      OUTPUT_RETENTION_DAYS: ${OUTPUT_RETENTION_DAYS:-30}
    volumes:
      - llm-dashboard-data:/data
    mem_limit: 1g
    cpus: 1
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/auth/status', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3

volumes:
  llm-dashboard-data:
    name: ${DATA_VOLUME_NAME:-llm-dashboard-data}
